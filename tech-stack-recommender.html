<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tech Stack Recommender · DecodeLabs Project 3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0f; }
  ::selection { background: rgba(240,165,0,0.3); }
  input::placeholder { color: #444; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: #0a0a0f; }
  ::-webkit-scrollbar-thumb { background: rgba(240,165,0,0.3); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const JOB_ROLES = [
  { title: "Data Scientist", skills: ["python", "machine learning", "sql", "statistics", "data analysis", "tensorflow", "pandas", "numpy", "visualization", "jupyter"] },
  { title: "Machine Learning Engineer", skills: ["python", "machine learning", "tensorflow", "pytorch", "deep learning", "algorithms", "data pipelines", "mlops", "docker", "kubernetes"] },
  { title: "Backend Developer", skills: ["python", "java", "sql", "apis", "databases", "node", "rest", "microservices", "docker", "git"] },
  { title: "Frontend Developer", skills: ["javascript", "react", "css", "html", "typescript", "ui design", "ux", "webpack", "git", "responsive design"] },
  { title: "Full Stack Developer", skills: ["javascript", "react", "node", "sql", "python", "apis", "git", "docker", "html", "css"] },
  { title: "DevOps Engineer", skills: ["docker", "kubernetes", "aws", "ci/cd", "linux", "automation", "terraform", "git", "monitoring", "cloud"] },
  { title: "Cloud Architect", skills: ["aws", "azure", "cloud", "kubernetes", "terraform", "networking", "security", "microservices", "docker", "automation"] },
  { title: "Data Engineer", skills: ["python", "sql", "spark", "data pipelines", "etl", "hadoop", "cloud", "databases", "aws", "airflow"] },
  { title: "Cybersecurity Analyst", skills: ["networking", "security", "linux", "ethical hacking", "firewalls", "cryptography", "risk assessment", "python", "incident response", "compliance"] },
  { title: "AI/NLP Engineer", skills: ["python", "machine learning", "nlp", "deep learning", "transformers", "pytorch", "tensorflow", "text processing", "algorithms", "research"] },
  { title: "Mobile Developer", skills: ["swift", "kotlin", "react native", "flutter", "javascript", "ui design", "apis", "git", "mobile ux", "databases"] },
  { title: "Site Reliability Engineer", skills: ["linux", "docker", "kubernetes", "monitoring", "python", "automation", "cloud", "networking", "ci/cd", "incident response"] },
  { title: "Blockchain Developer", skills: ["solidity", "web3", "javascript", "cryptography", "smart contracts", "ethereum", "python", "security", "git", "distributed systems"] },
  { title: "Database Administrator", skills: ["sql", "databases", "postgresql", "mysql", "performance tuning", "backup", "security", "linux", "data modeling", "monitoring"] },
  { title: "Systems Analyst", skills: ["systems design", "requirements analysis", "sql", "documentation", "project management", "uml", "testing", "communication", "python", "business analysis"] },
];

function buildVocabulary(roles) {
  const vocab = new Set();
  roles.forEach(r => r.skills.forEach(s => vocab.add(s.toLowerCase())));
  return [...vocab];
}

function computeTFIDF(roles, vocab) {
  const N = roles.length;
  const idf = {};
  vocab.forEach(term => {
    const df = roles.filter(r => r.skills.map(s => s.toLowerCase()).includes(term)).length;
    idf[term] = df > 0 ? Math.log(N / df) : 0;
  });
  return roles.map(role => {
    const skills = role.skills.map(s => s.toLowerCase());
    const totalTerms = skills.length;
    return vocab.map(term => {
      const tf = skills.filter(s => s === term).length / totalTerms;
      return tf * idf[term];
    });
  });
}

function buildUserVector(userSkills, vocab, roles) {
  const N = roles.length;
  const idf = {};
  vocab.forEach(term => {
    const df = roles.filter(r => r.skills.map(s => s.toLowerCase()).includes(term)).length;
    idf[term] = df > 0 ? Math.log(N / df) : 0;
  });
  const skills = userSkills.map(s => s.toLowerCase().trim());
  const totalTerms = skills.length;
  return vocab.map(term => {
    const tf = skills.filter(s => s === term).length / totalTerms;
    return tf * idf[term];
  });
}

function cosineSimilarity(a, b) {
  const dot = a.reduce((sum, ai, i) => sum + ai * b[i], 0);
  const magA = Math.sqrt(a.reduce((sum, ai) => sum + ai * ai, 0));
  const magB = Math.sqrt(b.reduce((sum, bi) => sum + bi * bi, 0));
  if (magA === 0 || magB === 0) return 0;
  return dot / (magA * magB);
}

const VOCAB = buildVocabulary(JOB_ROLES);
const ROLE_VECTORS = computeTFIDF(JOB_ROLES, VOCAB);
const ALL_SKILLS = [...new Set(JOB_ROLES.flatMap(r => r.skills))].sort();

function App() {
  const [inputValue, setInputValue] = React.useState("");
  const [skills, setSkills] = React.useState([]);
  const [results, setResults] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const [suggestions, setSuggestions] = React.useState([]);
  const [showSuggestions, setShowSuggestions] = React.useState(false);
  const [activeStep, setActiveStep] = React.useState(null);
  const inputRef = React.useRef(null);

  React.useEffect(() => {
    if (inputValue.length > 0) {
      const filtered = ALL_SKILLS.filter(s =>
        s.toLowerCase().includes(inputValue.toLowerCase()) && !skills.includes(s)
      ).slice(0, 6);
      setSuggestions(filtered);
      setShowSuggestions(filtered.length > 0);
    } else {
      setShowSuggestions(false);
    }
  }, [inputValue, skills]);

  const addSkill = (skill) => {
    const normalized = skill.toLowerCase().trim();
    if (normalized && !skills.includes(normalized)) {
      setSkills(prev => [...prev, normalized]);
    }
    setInputValue("");
    setShowSuggestions(false);
    inputRef.current && inputRef.current.focus();
  };

  const removeSkill = (skill) => setSkills(prev => prev.filter(s => s !== skill));

  const handleKeyDown = (e) => {
    if (e.key === "Enter" && inputValue.trim()) addSkill(inputValue);
  };

  const recommend = async () => {
    if (skills.length < 3) return;
    setLoading(true);
    setResults(null);
    for (let i = 1; i <= 4; i++) {
      await new Promise(r => setTimeout(r, 400));
      setActiveStep(i);
    }
    await new Promise(r => setTimeout(r, 300));
    const userVec = buildUserVector(skills, VOCAB, JOB_ROLES);
    const scored = JOB_ROLES.map((role, i) => ({
      ...role,
      score: cosineSimilarity(userVec, ROLE_VECTORS[i]),
    }));
    const sorted = scored.sort((a, b) => b.score - a.score).slice(0, 3);
    setResults(sorted);
    setLoading(false);
    setActiveStep(null);
  };

  const reset = () => { setSkills([]); setResults(null); setInputValue(""); setActiveStep(null); };

  const pipelineSteps = [
    { n: 1, label: "Ingestion", desc: "Capturing skills" },
    { n: 2, label: "Scoring", desc: "TF-IDF weights" },
    { n: 3, label: "Sorting", desc: "Cosine similarity" },
    { n: 4, label: "Filtering", desc: "Top-3 output" },
  ];

  const matchColors = ["#f0a500", "#8b5cf6", "#06b6d4"];
  const matchLabels = ["Best Match", "2nd Match", "3rd Match"];
  const quickSkills = ["python", "sql", "docker", "machine learning", "javascript", "aws", "react", "kubernetes"];

  return (
    <div style={{ minHeight:"100vh", background:"#0a0a0f", fontFamily:"'Courier New',monospace", color:"#e8e8d8", padding:0 }}>
      {/* Grid background */}
      <div style={{ position:"fixed", inset:0, zIndex:0, backgroundImage:"linear-gradient(rgba(240,165,0,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(240,165,0,0.04) 1px,transparent 1px)", backgroundSize:"40px 40px" }} />
      <div style={{ position:"fixed", top:0, left:0, width:100, height:100, borderRight:"1px solid rgba(240,165,0,0.15)", borderBottom:"1px solid rgba(240,165,0,0.15)", zIndex:1 }} />
      <div style={{ position:"fixed", top:0, right:0, width:100, height:100, borderLeft:"1px solid rgba(240,165,0,0.15)", borderBottom:"1px solid rgba(240,165,0,0.15)", zIndex:1 }} />

      <div style={{ position:"relative", zIndex:2, maxWidth:820, margin:"0 auto", padding:"48px 24px 80px" }}>

        {/* Header */}
        <div style={{ marginBottom:40 }}>
          <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
            <span style={{ fontSize:11, letterSpacing:"0.3em", color:"#f0a500", textTransform:"uppercase" }}>DecodeLabs · Project 3</span>
            <span style={{ width:36, height:1, background:"#f0a500", opacity:0.4 }} />
            <span style={{ fontSize:11, color:"#555", letterSpacing:"0.2em" }}>AI RECOMMENDATION LOGIC</span>
          </div>
          <h1 style={{ fontSize:"clamp(2rem,5vw,3rem)", fontWeight:900, letterSpacing:"-0.02em", lineHeight:1.1, margin:"0 0 10px", fontFamily:"Georgia,serif" }}>
            Tech Stack<br /><span style={{ color:"#f0a500" }}>Recommender</span>
          </h1>
          <p style={{ color:"#777", fontSize:14, maxWidth:440, lineHeight:1.6 }}>
            Content-based filtering engine. Enter your skills — the algorithm maps your profile to job roles using TF-IDF weighting and cosine similarity.
          </p>
        </div>

        {/* Input Panel */}
        <div style={{ background:"rgba(255,255,255,0.02)", border:"1px solid rgba(240,165,0,0.2)", borderRadius:2, padding:28, marginBottom:24 }}>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:20 }}>
            <span style={{ width:6, height:6, background:"#f0a500", borderRadius:"50%" }} />
            <span style={{ fontSize:11, letterSpacing:"0.22em", color:"#aaa", textTransform:"uppercase" }}>Step 1 — Ingest User Profile</span>
            <span style={{ marginLeft:"auto", fontSize:12, color: skills.length >= 3 ? "#4ade80" : "#f0a500" }}>{skills.length}/3 min</span>
          </div>

          <div style={{ position:"relative", marginBottom:16 }}>
            <div style={{ display:"flex", gap:8, background:"#0f0f18", border:"1px solid rgba(255,255,255,0.1)", borderRadius:2, padding:"10px 14px", alignItems:"center" }}>
              <span style={{ color:"#f0a500", fontSize:13 }}>&gt;_</span>
              <input
                ref={inputRef}
                value={inputValue}
                onChange={e => setInputValue(e.target.value)}
                onKeyDown={handleKeyDown}
                placeholder="Type a skill and press Enter (e.g. python, docker, sql...)"
                style={{ background:"transparent", border:"none", outline:"none", color:"#e8e8d8", fontSize:14, flex:1, fontFamily:"inherit", caretColor:"#f0a500" }}
              />
              <button onClick={() => inputValue.trim() && addSkill(inputValue)}
                style={{ background:"#f0a500", color:"#0a0a0f", border:"none", borderRadius:2, padding:"4px 12px", fontSize:12, fontWeight:700, cursor:"pointer", fontFamily:"inherit", letterSpacing:"0.1em" }}>
                ADD
              </button>
            </div>
            {showSuggestions && (
              <div style={{ position:"absolute", top:"100%", left:0, right:0, zIndex:50, background:"#13131f", border:"1px solid rgba(240,165,0,0.3)", borderTop:"none", borderRadius:"0 0 2px 2px" }}>
                {suggestions.map(s => (
                  <div key={s} onClick={() => addSkill(s)}
                    style={{ padding:"8px 16px", cursor:"pointer", fontSize:13, color:"#ccc", borderBottom:"1px solid rgba(255,255,255,0.04)" }}
                    onMouseEnter={e => e.currentTarget.style.background="rgba(240,165,0,0.1)"}
                    onMouseLeave={e => e.currentTarget.style.background="transparent"}>
                    <span style={{ color:"#f0a500" }}>→</span> {s}
                  </div>
                ))}
              </div>
            )}
          </div>

          {skills.length > 0 && (
            <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:16 }}>
              {skills.map(skill => (
                <span key={skill} style={{ display:"inline-flex", alignItems:"center", gap:6, background:"rgba(240,165,0,0.1)", border:"1px solid rgba(240,165,0,0.4)", borderRadius:2, padding:"4px 10px", fontSize:12, color:"#f0a500", fontWeight:600, letterSpacing:"0.05em" }}>
                  {skill}
                  <span onClick={() => removeSkill(skill)} style={{ cursor:"pointer", opacity:0.6, fontSize:14 }}>×</span>
                </span>
              ))}
            </div>
          )}

          <div>
            <span style={{ fontSize:11, color:"#444", letterSpacing:"0.15em", textTransform:"uppercase", marginRight:8 }}>Quick add:</span>
            {quickSkills.map(s => (
              <button key={s} onClick={() => addSkill(s)} disabled={skills.includes(s)}
                style={{ background:"transparent", border:"1px solid rgba(255,255,255,0.1)", borderRadius:2, color: skills.includes(s) ? "#333" : "#666", fontSize:11, padding:"3px 8px", cursor: skills.includes(s) ? "default" : "pointer", marginRight:6, marginBottom:4, fontFamily:"inherit" }}>
                {s}
              </button>
            ))}
          </div>
        </div>

        {/* Pipeline animation */}
        {(loading || activeStep) && (
          <div style={{ background:"rgba(255,255,255,0.02)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:2, padding:"20px 28px", marginBottom:24 }}>
            <div style={{ fontSize:11, letterSpacing:"0.2em", color:"#555", textTransform:"uppercase", marginBottom:14 }}>Pipeline Executing...</div>
            <div style={{ display:"flex", alignItems:"stretch", gap:0 }}>
              {pipelineSteps.map((step, i) => (
                <div key={step.n} style={{ display:"flex", alignItems:"center", flex:1 }}>
                  <div style={{ flex:1, padding:"12px 10px", border:`1px solid ${activeStep >= step.n ? "#f0a500" : "rgba(255,255,255,0.07)"}`, background: activeStep >= step.n ? "rgba(240,165,0,0.08)" : "transparent", borderRadius:2, transition:"all 0.3s" }}>
                    <div style={{ fontSize:10, color: activeStep >= step.n ? "#f0a500" : "#444", marginBottom:2 }}>{activeStep >= step.n ? "✓" : step.n}</div>
                    <div style={{ fontSize:12, fontWeight:700, color: activeStep >= step.n ? "#e8e8d8" : "#555" }}>{step.label}</div>
                    <div style={{ fontSize:10, color:"#555" }}>{step.desc}</div>
                  </div>
                  {i < 3 && <div style={{ width:18, textAlign:"center", color: activeStep > step.n ? "#f0a500" : "#333", fontSize:14 }}>→</div>}
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Run button */}
        {!results && !loading && (
          <button onClick={recommend} disabled={skills.length < 3}
            style={{ width:"100%", padding:16, background: skills.length >= 3 ? "#f0a500" : "rgba(240,165,0,0.08)", border:`1px solid ${skills.length >= 3 ? "#f0a500" : "rgba(240,165,0,0.15)"}`, borderRadius:2, color: skills.length >= 3 ? "#0a0a0f" : "#444", fontSize:13, fontWeight:900, letterSpacing:"0.25em", cursor: skills.length >= 3 ? "pointer" : "not-allowed", fontFamily:"inherit", textTransform:"uppercase", marginBottom:24 }}>
            {skills.length < 3 ? `Add ${3 - skills.length} more skill${3 - skills.length !== 1 ? "s" : ""} to run` : "▶  Execute Recommendation Engine"}
          </button>
        )}

        {/* Results */}
        {results && (
          <div>
            <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:22 }}>
              <span style={{ fontSize:11, letterSpacing:"0.22em", color:"#4ade80", textTransform:"uppercase" }}>✓ Output · Top-3 Career Matches</span>
              <span style={{ flex:1, height:1, background:"rgba(74,222,128,0.2)" }} />
              <button onClick={reset} style={{ background:"transparent", border:"1px solid rgba(255,255,255,0.1)", borderRadius:2, color:"#666", fontSize:11, padding:"4px 12px", cursor:"pointer", fontFamily:"inherit", letterSpacing:"0.1em" }}>RESET</button>
            </div>

            <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
              {results.map((role, i) => (
                <div key={role.title} style={{ border:`1px solid ${i === 0 ? matchColors[0] : "rgba(255,255,255,0.08)"}`, borderLeft:`3px solid ${matchColors[i]}`, borderRadius:2, padding:"20px 24px", background: i === 0 ? "rgba(240,165,0,0.04)" : "rgba(255,255,255,0.01)", position:"relative" }}>
                  <div style={{ position:"absolute", top:14, right:18, fontSize:10, letterSpacing:"0.18em", color:matchColors[i], textTransform:"uppercase" }}>{matchLabels[i]}</div>
                  <div style={{ display:"flex", alignItems:"flex-start", gap:14, marginBottom:14 }}>
                    <div style={{ fontSize:"1.8rem", fontWeight:900, color:matchColors[i], fontFamily:"Georgia,serif", lineHeight:1, opacity:0.25, minWidth:36 }}>{String(i+1).padStart(2,"0")}</div>
                    <div>
                      <div style={{ fontSize:20, fontWeight:700, letterSpacing:"-0.01em", marginBottom:6, fontFamily:"Georgia,serif" }}>{role.title}</div>
                      <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                        <div style={{ width:130, height:3, background:"rgba(255,255,255,0.06)", borderRadius:2, overflow:"hidden" }}>
                          <div style={{ height:"100%", width:`${(role.score*100).toFixed(1)}%`, background:matchColors[i], borderRadius:2 }} />
                        </div>
                        <span style={{ fontSize:13, fontWeight:700, color:matchColors[i] }}>{(role.score*100).toFixed(1)}% match</span>
                      </div>
                    </div>
                  </div>
                  <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                    {role.skills.map(skill => {
                      const isMatch = skills.includes(skill.toLowerCase());
                      return (
                        <span key={skill} style={{ fontSize:11, padding:"3px 8px", borderRadius:2, border:`1px solid ${isMatch ? matchColors[i]+"80" : "rgba(255,255,255,0.06)"}`, background: isMatch ? `${matchColors[i]}15` : "transparent", color: isMatch ? matchColors[i] : "#444", fontWeight: isMatch ? 700 : 400 }}>
                          {isMatch ? "✓ " : ""}{skill}
                        </span>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>

            <div style={{ marginTop:20, padding:"14px 18px", border:"1px solid rgba(255,255,255,0.05)", borderRadius:2, background:"rgba(255,255,255,0.01)" }}>
              <div style={{ fontSize:11, color:"#555", lineHeight:1.7 }}>
                <span style={{ color:"#f0a500" }}>Algorithm:</span> TF-IDF vectorization across {JOB_ROLES.length} job roles ({VOCAB.length}-dim space) → Cosine similarity → Sort descending → Top-3 filter<br />
                <span style={{ color:"#f0a500" }}>Your profile:</span> [{skills.join(", ")}]
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
